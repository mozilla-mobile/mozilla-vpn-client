name: Release Candidate Automation
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"
  # For testing - remove before merge
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  flathub-beta:
    name: Submit Flathub Beta Release
    #environment:
    #  name: flathub
    runs-on: ubuntu-slim
    steps:
      - name: Checkout flathub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: flathub
          # For testing - remove before merge
          #repository: flathub/org.mozilla.vpn
          repository: oskirby/org.mozilla.vpn
          ref: beta

      - name: Checkout tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          repository: flatpak/flatpak-builder-tools
          ref: master

      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: upstream
          sparse-checkout: |
            linux/flatpak/
            Cargo.lock
            requirements.in

      - name: Update release details
        run: |
          curl -sSL -o org.mozilla.vpn.releases.xml \
            https://mozilla.github.io/mozillavpn-product-details/org.mozilla.vpn.releases.xml

      - name: Update cargo dependencies
        run: python tools/cargo/flatpak-cargo-generator.py -o flatpak-vpn-crates.json upstream/Cargo.lock

      - name: Update flatpak manifest
        run: python upstream/linux/flatpak/flatpak-update-ref.py upstream/linux/flatpak/org.mozilla.vpn.yml | tee org.mozilla.vpn.yml

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: cpr
        with:
          author: ${GITHUB_ACTOR}" <${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com>
          committer: ${GITHUB_ACTOR}" <${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com>
          commit-message: "[beta] update mozillavpn to ${GITHUB_REF_NAME}"
          branch: "beta-${GITHUB_REF_NAME}"
          delete-branch: true
          title: "[beta] update mozillavpn to ${GITHUB_REF_NAME}"
          token: ${{ secrets.FLATHUB_TOKEN }}
